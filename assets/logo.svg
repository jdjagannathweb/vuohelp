<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 115" width="100%" height="100%">
  <defs>
    <!-- Background & Shield Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="amberTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Glow & Drop Shadow Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- ================= EMBLEM / ICON (LEFT) ================= -->
  <g transform="translate(6, 4)" filter="url(#shadowEffect)">
    <!-- Outer Golden Shield -->
    <path d="M52 2 L98 24 L98 76 L52 104 L6 76 L6 24 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3.8" stroke-linejoin="round" />

    <!-- Inner Shield Border / Glow -->
    <path d="M52 8 L90 27 L90 71 L52 96 L14 71 L14 27 Z" fill="#061c33" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />

    <!-- Inner Digital Circuit Ring -->
    <circle cx="52" cy="52" r="32" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.6" />
    <circle cx="52" cy="52" r="22" fill="#0c4a6e" stroke="url(#goldGrad)" stroke-width="2.2" />

    <!-- Circuit Trace Lines & Nodes -->
    <circle cx="52" cy="18" r="3.5" fill="#fbbf24" />
    <circle cx="24" cy="65" r="3.2" fill="#38bdf8" />
    <circle cx="80" cy="65" r="3.2" fill="#38bdf8" />
    <line x1="52" y1="18" x2="24" y2="65" stroke="#38bdf8" stroke-width="1.8" opacity="0.75" />
    <line x1="52" y1="18" x2="80" y2="65" stroke="#38bdf8" stroke-width="1.8" opacity="0.75" />
    <line x1="24" y1="65" x2="80" y2="65" stroke="#38bdf8" stroke-width="1.8" opacity="0.75" />

    <!-- Central Majestic "V" Digital Wings -->
    <path d="M34 42 L52 70 L70 42" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M34 42 L52 70 L70 42" fill="none" stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Radiant Star on Shield Top Crown -->
    <path d="M52 5 L55 13 L63 15 L57 21 L59 29 L52 25 L45 29 L47 21 L41 15 L49 13 Z" fill="url(#goldGrad)" filter="url(#glowEffect)" />
    <circle cx="52" cy="17" r="2" fill="#ffffff" />
  </g>

  <!-- ================= TYPOGRAPHY (RIGHT) ================= -->
  <g transform="translate(118, 4)">
    
    <!-- Primary Big Brand Header: VLE HELP DESK -->
    <g filter="url(#textGlow)">
      <text x="0" y="48" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="52" letter-spacing="1.2">
        <tspan fill="#38bdf8">VLE</tspan>
        <tspan fill="#ffffff"> </tspan>
        <tspan fill="url(#amberTextGrad)">HELP</tspan>
        <tspan fill="#ffffff"> </tspan>
        <tspan fill="#ffffff">DESK</tspan>
      </text>
    </g>

    <!-- Subtitle Pill Badge -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="330" height="24" rx="6" fill="#071e3d" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="12" cy="12" r="4" fill="#10b981" />
      <circle cx="12" cy="12" r="7" fill="#10b981" opacity="0.3" />
      <text x="24" y="16.5" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="12" fill="#bae6fd" letter-spacing="1.2">
        ODISHA CSC DIGITAL SERVICES &amp; TOOLS
      </text>
    </g>

    <!-- Odia Tagline Line -->
    <g transform="translate(0, 102)">
      <text x="0" y="0" font-family="'Noto Sans Odia', 'Segoe UI', sans-serif" font-weight="700" font-size="14.5" fill="#fbbf24">
        ସମସ୍ତ CSC ସେବା ଓ ଡିଜିଟାଲ୍ ଟୁଲ୍ — VLE HELP DESK
      </text>
    </g>

  </g>
</svg>
